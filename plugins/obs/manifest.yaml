# OBS Studio plugin.
# obs-websocket v5 over loopback only.
#
# Tool surface: read-only status/scene inventory, a confirmed scene switch inside the Nox scene
# set, the privacy scene, a read-only preflight check, the Clip Pipeline's path into OBS
# (replay-buffer save/status), and full control through `obs.request` - any obs-websocket
# request, classified per request type by the core (`nox.stream.obs_requests`): reads run,
# changes are confirmed, destructive changes are confirmed every time, and stopping the stream,
# reading the stream key, hotkeys, vendor requests and file writes are never possible. The
# manifest risk of `obs.request` is the ceiling for anything the core cannot classify.
#
# Runs in the companion profile too, so Nox notices when OBS goes live and can start the stream
# session itself (`nox.stream.autostart`).
id: obs
name: OBS Studio
version: 0.2.0
api_version: 1
entry: nox_plugin_obs:create
profiles: [companion, stream]
permissions:
  - tool: obs.status.read             # risk: read - full scene/source/stream-state snapshot
    risk: read
  - tool: obs.scenes.list             # risk: read
    risk: read
  - tool: obs.scene.switch            # risk: medium - confirm in the `stream` profile; target must
    risk: medium                      # be a name from `config.scene_set`
  - tool: obs.privacy_scene.activate  # risk: medium - manual, confirmable trigger of the privacy
    risk: medium                      # scene (the security.panic path below bypasses confirm)
  - tool: obs.preflight.check         # risk: read - draft pre-flight, honest "unknown" for
    risk: read                        # items OBS cannot observe
  - tool: obs.replay_buffer.save         # risk: medium - triggers OBS's own replay-buffer save and
    risk: medium                         # resolves the written path; never touches
                                          # the live recording
  - tool: obs.replay_buffer.status.read  # risk: read - whether OBS's replay buffer is active
    risk: read
  - tool: obs.request                 # risk: per request type (core classifier); high is the
    risk: high                        # ceiling for an unknown type
  - tool: obs.screenshot              # risk: read - small JPEG to a local folder, path only
    risk: read
  - tool: obs.overlay.setup           # risk: medium - create/update the "Nox Overlay" browser
    risk: medium                      # source with Nox's overlay URL
  - tool: obs.audio_track.setup       # risk: medium - "Nox Voice" audio input on the virtual
    risk: medium                      # cable Nox speaks into
events:
  emits: [obs.connected, obs.disconnected, obs.scene_changed, stream.started, stream.ended,
          obs.recording_changed, obs.auth_failed]
  listens: [security.panic]
secrets: [nox/obs/websocket_password]
network:
  egress: ["127.0.0.1:4455"]
resources:
  memory_mb: 128
  priority: normal
config:
  host: "127.0.0.1"
  port: 4455
  # Designated privacy/panic scene and the allow-listed Nox scene set - both defaults,
  # adjust them to the scene names of your OBS setup.
  privacy_scene: "Technical Problems"  # default; rename to match your OBS
  scene_set:                          # default set
    - "Start"
    - "Live"
    - "Pause"
    - "Gaming"
    - "Just Chatting"
    - "End"
    - "Technical Problems"
    - "Smoking"
  subscribe_events: true
  min_backoff_s: 1.0
  max_backoff_s: 30.0
  # obs.screenshot: where the small JPEGs go (the latest five are kept); empty = the system
  # temp folder's `nox-obs`.
  screenshot_dir: ""
  replay_save_timeout_s: 10.0  # obs.replay_buffer.save: max wait for OBS's ReplayBufferSaved event
