# Nox permission profile "companion" (Security Model §3). Default everyday profile.
# `permissions` is read by nox.security.profiles; every other top-level key is a config overlay
# merged by nox.core.config (ADR-010 layer 3). Hard prohibitions cannot be lifted here (§4).
security:
  profile: companion

permissions:
  id: companion
  description: Local-first everyday companion. Cloud per privacy mode, confirm for medium/high risk.
  cloud_allowed: true
  # api.telegram.org: the Mobile Companion bot (EPIC-17). Only reachable while `remote.enabled` is
  # true and a device is paired; the plugin's own manifest allow-list is the same single host.
  # id.twitch.tv: the user-initiated Twitch OAuth device-code login (nox.settings.twitch_auth).
  egress_allowlist: ["api.telegram.org:443", "id.twitch.tv:443"]
  memory_writes_allowed: true
  screenshots_to_cloud: false
  filesystem_roots: []            # empty = inherit global read/write roots (FR-14.1)
  tools_allowed: []
  integrations_allowed: [ollama, claude_code, telegram]
  rules:
    - id: companion.memory.write
      tool: "memory*"
      action: "write"
      decision: allow
    - id: companion.vault.inbox
      tool: "vault*"
      action: "append_inbox"
      decision: allow
    - id: companion.filesystem.delete
      tool: "filesystem*"
      action: "delete*"
      decision: confirm
      reason: "deletion is quarantine-only and always confirmed (FR-14.1)"
    - id: companion.shell
      tool: "shell*"
      decision: confirm
      reason: "terminal commands are allow-listed and confirmed outside coding (FR-14.2)"
    - id: companion.git.push
      tool: "git*"
      action: "push*"
      decision: confirm
    - id: companion.web.search
      tool: "web*"
      action: "search"
      decision: allow
