# Nox permission profile "work": local only, and nothing is remembered.
# Work code stays local; no cloud transfer, no screenshots of work content to the cloud, no entries
# in the normal vault or memory. Enforced by the permission engine and egress guard, not by prompt.
security:
  profile: work

permissions:
  id: work
  description: Work profile. Local models only, egress limited to the explicit allow-list, no memory or vault writes.
  cloud_allowed: false
  egress_allowlist:               # cloud_allowed=false: only this list applies, never the global one
    - "127.0.0.1:*"
    - "localhost:*"
  memory_writes_allowed: false
  screenshots_to_cloud: false
  # Work roots (employer folders) are set in the user layer; they are forbidden roots outside this profile.
  filesystem_roots: []
  tools_allowed: []
  integrations_allowed: [ollama]
  rules:
    # A preset step that starts a program the user registered. The decision turns on who is
    # asking, which is the whole point of the split: `agent: presets` is the core carrying out
    # steps from the user's own configuration, reached by their own phrase, schedule or button -
    # the program, the preset and the trigger are all theirs, and a dialog would only ask them to
    # confirm what they already wrote down. A model asking for `presets.run_action` itself does
    # not match this rule and falls to the default for high risk, which is confirm.
    - id: work.presets.run_action
      agent: presets
      tool: "presets"
      action: "run_action"
      decision: allow
      reason: "the program, the preset and the trigger were all configured by the user"
    - id: work.memory.write
      tool: "memory*"
      action: "write"
      decision: deny
      reason: "work sessions leave no memory entries"
    - id: work.vault.write
      tool: "vault*"
      action: "write"
      decision: deny
      reason: "work sessions leave no vault entries"
    - id: work.vault.inbox
      tool: "vault*"
      action: "append_inbox"
      decision: deny
    - id: work.cloud
      tool: "cloud*"
      decision: deny
      reason: "work content never goes to the cloud"
    - id: work.screenshot.upload
      tool: "screenshot*"
      action: "upload*"
      decision: deny
    - id: work.git.push
      tool: "git*"
      action: "push*"
      decision: confirm
    - id: work.shell
      tool: "shell*"
      decision: confirm
