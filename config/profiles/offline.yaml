# Nox permission profile "offline" (Security Model §3). No network egress; the allow-listed local
# services stay reachable, so the local model can still answer while offline.
security:
  profile: offline
privacy:
  mode: offline

permissions:
  id: offline
  description: Fully offline. No network egress, local models and tools only.
  cloud_allowed: false
  egress_allowlist: []             # no host outside loopback is reachable
  loopback_allowlist: ["127.0.0.1:11434"]   # local chat must keep working offline
  memory_writes_allowed: true
  screenshots_to_cloud: false
  filesystem_roots: []
  tools_allowed: []
  integrations_allowed: [ollama]
  rules:
    # A preset step that starts a program the user registered. The decision turns on who is
    # asking, which is the whole point of the split: `agent: presets` is the core carrying out
    # steps from the user's own configuration, reached by their own phrase, schedule or button -
    # the program, the preset and the trigger are all theirs, and a dialog would only ask them to
    # confirm what they already wrote down. A model asking for `presets.run_action` itself does
    # not match this rule and falls to the default for high risk, which is confirm.
    - id: offline.presets.run_action
      agent: presets
      tool: "presets"
      action: "run_action"
      decision: allow
      reason: "the program, the preset and the trigger were all configured by the user"
    - id: offline.cloud
      tool: "cloud*"
      decision: deny
      reason: "offline: no external communication"
    - id: offline.web
      tool: "web*"
      decision: deny
    - id: offline.browser
      tool: "browser*"
      decision: deny
    - id: offline.network
      tool: "network*"
      decision: deny
    - id: offline.twitch
      tool: "twitch*"
      decision: deny
    - id: offline.telegram
      tool: "telegram*"
      decision: deny
    - id: offline.memory.write
      tool: "memory*"
      action: "write"
      decision: allow
