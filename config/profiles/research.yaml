# Nox permission profile "research": cloud and web tools are allowed.
security:
  profile: research

permissions:
  id: research
  description: Broad daily research. Web search/fetch and cloud providers allowed; no purchases, no form side effects.
  cloud_allowed: true
  egress_allowlist: []
  memory_writes_allowed: true
  screenshots_to_cloud: false
  filesystem_roots: []
  tools_allowed: []
  integrations_allowed: [ollama, claude_code, web]
  rules:
    # A preset step that starts a program the user registered. The decision turns on who is
    # asking, which is the whole point of the split: `agent: presets` is the core carrying out
    # steps from the user's own configuration, reached by their own phrase, schedule or button -
    # the program, the preset and the trigger are all theirs, and a dialog would only ask them to
    # confirm what they already wrote down. A model asking for `presets.run_action` itself does
    # not match this rule and falls to the default for high risk, which is confirm.
    - id: research.presets.run_action
      agent: presets
      tool: "presets"
      action: "run_action"
      decision: allow
      reason: "the program, the preset and the trigger were all configured by the user"
    - id: research.web.search
      tool: "web*"
      action: "search"
      decision: allow
    - id: research.web.fetch
      tool: "web*"
      action: "fetch"
      decision: allow
      reason: "text first, read-only"
    - id: research.browser.navigate
      tool: "browser*"
      action: "navigate"
      decision: allow
    - id: research.browser.purchase
      tool: "browser*"
      action: "purchase*"
      decision: deny
      reason: "never buys anything and never signs anything"
    - id: research.browser.form_submit
      tool: "browser*"
      action: "form.submit"
      decision: confirm
      reason: "form submission with consequences needs approval"
    - id: research.browser.download
      tool: "browser*"
      action: "download"
      decision: confirm
      reason: "downloads only into staging with a Defender scan"
    - id: research.vault.write_research
      tool: "vault*"
      action: "write"
      target: "*14 - Research*"
      decision: allow
    - id: research.memory.write
      tool: "memory*"
      action: "write"
      decision: allow
