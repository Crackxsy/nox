# Nox default configuration (layer 1 of 4: defaults -> user -> profile/preset -> runtime override).
# No secrets in this file. Secrets live in the Windows Credential Manager (see nox.security.secrets).
# Every key here is validated against the JSON schema generated from nox.core.config.NoxConfig.

schema_version: 1

identity:
  name: Nox
  user_display_name: ""          # filled at first start
  ui_language: de                # de | en
  speech_language: auto          # de | en | auto
  locale:
    time_format: "24h"
    date_format: "DD.MM.YYYY"
    timezone: "Europe/Berlin"
    units: metric

paths:
  # Everything Nox stores lives below data_dir: vault, index, database, cache, backups, runtime
  # tokens and logs. Moving this one key moves all of them.
  data_dir: "${APPDATA}/Nox"
  # vault_dir / index_dir / database_dir / cache_dir / backups_dir / logs_dir each default to
  # <data_dir>/<name>. Set one here only to move that one somewhere else.
  runtime_dir: "${APPDATA}/Nox/runtime"
  # runtime_dir stays here on purpose: the desktop shell and the pet window look for the session
  # token and the port file before they have read any configuration. It holds no data of yours -
  # both files are recreated on every start.
  # ${VAR}, $VAR, %VAR% and ~ are expanded when the configuration is read.

security:
  # companion | coding | stream | research | work | offline | rocket_league
  profile: companion
  # With a PIN configured, ask for it before a change that weakens protection: leaving a stricter
  # privacy mode, switching a capture device back on, editing a security or privacy setting, or
  # changing a stored credential. Making Nox stricter never asks.
  pin_required_for_security_changes: true
  hard_prohibitions:             # never overridable by any profile, plugin, runtime override or LLM
    - game.input.send
    - game.memory.read
    - game.process.inject
    - anticheat.bypass
    - stream.key.read
    - stream.stop
    - recording.delete
    - security.core.modify_without_pin
    - permission.self_elevate
  egress_allowlist:              # global network allow-list (host, host:port, *.example.com:443);
                                 # a profile with its own egress_allowlist replaces this list
    - "id.twitch.tv:443"         # the Twitch sign-in flow, started only by the user from the
                                 # dashboard; never contacted on its own. See docs/PRIVACY.md.
                                 # Blocked in privacy mode private/offline like anything else.
  loopback_allowlist:            # local services still reachable in privacy mode private/offline
    - "127.0.0.1:11434"          # Ollama; profiles may add entries (OBS in the stream profile)
  audit:
    enabled: true
    retention_days_security: 730
    retention_days_normal: 14

privacy:
  mode: balanced                 # full | balanced | private | offline
  capture:
    microphone: true
    camera: false
    screen: true
  zones:                         # apps/windows whose content is never analyzed (titles may be known)
    - banking
    - password_manager
    - email
    - private_chats
    - personal_documents
    - discord
  retention:
    raw_transcripts_days: 7
    logs_days: 14
    metrics_days: 365
    viewer_data_inactive_months: 12

ipc:
  host: 127.0.0.1
  port: 47800                    # WebSocket hub
  http_port: 47801               # static UI (pet renderer, dashboard) and health endpoint
  schema_version: 1
  auth: token                    # per-start session tokens issued by core, stored under %APPDATA%/Nox/runtime

voice:
  models_dir: ""                 # root for piper/kokoro/openwakeword model files;
                                 # empty = <paths.data_dir>/models. The voice worker only receives
                                 # this section, so repeat the path here if paths.data_dir moved.
  stt:
    engine: faster-whisper
    model: small
    device: cpu
    language: auto
    vad: true
    wake_word: "Nox"
    push_to_talk_hotkey: "ctrl+alt+space"
    listening_mode: ptt_only     # ptt_only | continuous. The default never opens the microphone on
                                 # its own: hold push-to-talk to speak. Switch to continuous for
                                 # hands-free wake-word listening (costs CPU, wants a wake model).
    # A wake-word gate sits in front of transcription. Without it every detected speech segment
    # is transcribed, which is where the 20-40 s backlog with background audio came from.
    wake_word_engine: openwakeword   # openwakeword | text; falls back to text (health: limited)
                                     # when the package or the model file is missing
    wake_word_model: ""          # file in <models_dir>/openwakeword, or an absolute path;
                                 # empty = every model there. openWakeWord has no "Nox" model,
                                 # so this stays empty until one is trained -> text matching.
    wake_word_threshold: 0.5
    wake_window_s: 8             # a detection keeps the gate open this long
    conversation_window_s: 20    # follow-up questions may skip the wake word for this long
    kill_phrase_watchdog: true   # short segments still reach Whisper so "Nox Notaus" keeps
    kill_watchdog_max_ms: 2500   # working; non-kill transcripts are discarded, never reported
  tts:
    engine: piper                # piper | kokoro. Kokoro needs the voice-kokoro extra and its
                                 # model files in <models_dir>/kokoro
                                 # (python -m nox.worker --download-kokoro).
    voice: ""                    # engine-specific voice id; empty = the engine default
                                 # (piper: de_DE-thorsten-medium, kokoro: af_heart - no German
                                 # voice exists in Kokoro v1.0, see README)
    rate: 1.0
    volume: 0.8
    streaming: true
  channels:
    private_device: ""           # default output device when empty
    stream_device: ""            # e.g. VB-Audio Cable input, empty = disabled
    routing: private             # private | stream | both | mute
  barge_in: true

ai:
  router:
    default_reasoner: claude_code   # the degradation chain below applies when it is unavailable
    fallback_chain: [claude_code, ollama, rules]
    roles:                          # per-role chains; the local model answers chat fastest
      chat: [ollama, claude_code, rules]
    background_budget_share: 0.30
    reserve_for_stream: true
  providers:
    claude_code:
      enabled: true
      command: "claude"
      timeout_s: 120
      model: "sonnet"              # same first-token latency as the CLI default, lower cost
      health_roundtrip: true       # 1-token probe at startup/health check (set false to save quota)
    ollama:
      enabled: true
      base_url: "http://127.0.0.1:11434"
      model: "llama3.2:3b"
      gpu_allowed_modes: [companion, coding, research, idle]   # never during rocket_league
      timeout_s: 60

pet:
  renderer: web                  # web renderer hosted by core, shown in the Qt shell and OBS
  default_monitor: left
  always_on_top: true
  click_through_when_idle: false
  fps_target: 60
  fps_in_game: 20
  greeting_enabled: true          # speak the startup greeting (the speech policy still decides)
  quiet_in_private_modes: true    # no unsolicited speech (greeting, hints) while privacy mode is
                                   # private or offline; replies to you are never blocked
  variant: neutral                # creature shape rendered by the pet window
                                   # (ui/pet/src/variants), or sprite:<id> for a sprite set

plugins:                         # plugin workers (plugins/<id>/manifest.yaml)
  enabled: []                    # plugin ids started at boot; empty = no plugin runs
  dir: null                      # null = the plugins folder shipped with Nox

stream:                          # the stream bot. Every rate below is a conservative starting
                                 # value - tune them once your channel has data.
  funken:                        # the channel currency: how viewers earn it, and the loyalty tiers
    earn_per_message: 1.0
    earn_per_sub: 50.0
    earn_per_bit: 0.1
    earn_per_raid: 20.0
    earn_cooldown_s: 30.0        # anti-farming, between two messages of the same viewer
    tier_names: [newcomer, regular, supporter, veteran, legend]
    tier_thresholds: [0, 100, 500, 2000, 10000]
  chat:
    retain_raw_text_days: 7      # chat is speech: kept as briefly as a voice transcript
  relevance:
    unsolicited_interval_s: 120.0   # roughly one unsolicited chat message every two minutes
    mention_cooldown_s: 5.0
  twitch:                        # read by the twitch plugin; editable in the dashboard
    channel: ""                  # channel Nox joins; empty = the twitch plugin never joins one
    bot_names: [nox]             # names/aliases that count as "the bot was addressed"
    relevance_cooldown_s: 20.0   # per-viewer cooldown of the relevance classifier
    rate_limit_max_messages: 20  # send budget per window; Twitch itself allows 20 per 30 s
    rate_limit_window_s: 30.0
    rate_limit_min_gap_s: 1.5    # minimum pause between two chat messages
    min_backoff_s: 1.0           # IRC reconnect backoff, doubled up to max_backoff_s
    max_backoff_s: 30.0

attention:
  proactivity_level: 3           # 0..5 global ceiling
  per_mode: { stream: 4, companion: 3, creative: 2, research: 2, coding: 2, rocket_league: 1, focus: 0 }
  interruptions_per_hour: 3
  quiet_hours: { start: "23:00", end: "08:00" }

health:
  check_interval_s: 30
  checkpoint_interval_s: 5

logging:
  level: INFO
  json: true
  pii_filter: true
  retention_days: 14             # daily rotation; overrides privacy.retention.logs_days when set

supervisor:
  restart_limit: 3
  restart_window_s: 300
  kill_switch_hotkey: "ctrl+alt+shift+k"
  control_host: 127.0.0.1
  control_port: 47799            # localhost control channel (heartbeats, kill); token in paths.runtime_dir
  heartbeat_interval_s: 2.0
  boot_grace_s: 90               # no missed-heartbeat accounting during a cold boot
  missed_for_graceful: 5
  missed_for_hard: 10
  kill_ack_timeout_s: 2.0
  stop_timeout_s: 6.0            # how long a shutdown request gives the core before it is
                                 # terminated
  core_command: ["python", "-m", "nox.app"]
  shell_command: ["python", "-m", "nox.shell"]
  shell_enabled: true

rl:                              # Rocket League coaching. The `rl` plugin itself is opt-in and
                                 # is not in plugins.enabled by default.
  detection:
    poll_interval_s: 2.0
    process_names: ["RocketLeague.exe"]
  replay:
    folder: null                 # null = find the (possibly cloud-redirected) Documents folder
                                 # at runtime; set it only for a non-default install
    backfill_batch_size: 25
    stable_check_interval_s: 2.0
    stable_checks: 2
  budget:                        # the ceiling the game must never notice
    max_gpu_pct: 10.0
    max_fps_loss_pct: 5.0
    capture_hz: 2.0
    min_capture_hz: 0.5
  callouts:
    min_per_minute: 2
    max_per_minute: 4
    cooldown_s: 20.0
    boost_low_threshold: 20
    demo_confidence_threshold: 0.75
    min_confidence: 0.6
  retention:                     # coaching data is only useful across a season
    events_days: 180
    matches_days: 365
  vision:                        # on-screen analysis during a match. Off even when `rl` is on: the
                                 # GPU budget on an entry-level card is the binding constraint, so
                                 # this never starts implicitly.
    enabled: false
    backend: none                 # none | opencv | onnx (onnx always reports unavailable until
                                   # onnxruntime is installed - it is not a dependency)
    sample_hz: 1.0
    min_confidence: 0.5           # below this, a detection is ignored rather than guessed at
    max_process_fraction: 0.5     # cost proxy: detection time / sample interval
    consecutive_over_budget: 3
    cooldown_s: 60.0
    detections_retain_hours: 6.0

remote:                          # the mobile companion. Off until you turn it on.
  enabled: false                 # no pairing, no remote kill switch, no phone bot without this
  pair_code_ttl_s: 300           # one-time pairing code lifetime, single use
  max_devices: 3
  rate_limit_per_minute: 20      # per sender; tighter than any local client
  rate_limit_burst: 5
  chat_enabled: true             # phone chat routes through the normal orchestrator (speak=False)
  notifications:
    enabled: true
    events:                      # allow-list; anything not named here is never sent to the phone
      - security.kill_switch
      - system.health_changed
      - stream.started
      - stream.ended
      - pm.focus_changed

clips:                          # the clip pipeline. Your recording folder is only ever read
                                 # from; Nox writes to its own roots.
  # library_root / export_root / quarantine_root default to <data_dir>/data/clips/<name>;
  # watch_dir defaults to <data_dir>/data/clips/incoming - point it at the replay-buffer output
  # folder of your recording software.
  highlight_kinds: [goal, save, win, overtime]   # game events that qualify as a highlight
  chat_hype_threshold: 0.75
  cooldown_s: 15.0                # anti-double-clip, per kind of trigger
  manual_lookback_s: 20.0         # how far back a manual clip looks for a game event to tag
  watch_poll_interval_s: 2.0
  watch_timeout_s: 30.0
  quarantine_days: 30             # discarded clips are moved here, never hard-deleted

pm:                              # project management, reading and writing notes in your vault
  epics_dir: "08 - Epics"
  stories_dir: "09 - Stories"
  projects_note: "Projects.md"   # single list note; this vault has no per-project folder yet
  watch_debounce_s: 1.5
  focus_max_items: 5

creative:                        # detecting creative applications. The patterns below are
                                 # deliberately narrow: not detecting an app is cheaper than
                                 # announcing a session that is not happening.
  hysteresis_s: 15.0             # how long a match must hold before the mode switches
  vault_folder: "16 - Creative Projects"
  app_patterns:
    blender:
      - { process: "blender.exe" }
    fl_studio:
      - { process: "fl64.exe" }
      - { process: "fl.exe" }
    krita:
      - { process: "krita.exe" }
    capcut:
      - { process: "capcut.exe" }
    davinci_resolve:
      - { process: "resolve.exe" }
    browser_daw:                 # a browser-hosted audio workstation: replace the title pattern
                                 # below with the one your own project uses
      - { process: "chrome.exe", title: "*Web DAW*" }
      - { process: "msedge.exe", title: "*Web DAW*" }
      - { process: "firefox.exe", title: "*Web DAW*" }

sensors:                         # local awareness: foreground window, idle, resource load and
                                 # the generic game-process hook
  enabled: true
  foreground:
    poll_interval_s: 1.0
  idle:
    poll_interval_s: 5.0
    idle_after_s: 600.0          # ten minutes without input counts as idle
    away_after_s: 1200.0         # twenty minutes counts as away
  resources:
    poll_interval_s: 5.0
    idle_poll_interval_s: 15.0   # adaptive sampling: slower while nothing is under pressure
    cpu_high_watermark_pct: 80.0
    gpu_enabled: true
  game:
    poll_interval_s: 5.0
    process_names: ["RocketLeague.exe"]
  history_len: 120

proactive:                       # when and how Nox speaks without being asked. Quiet hours,
                                 # proactivity_level, per_mode and interruptions_per_hour live
                                 # under `attention:` above and are reused, not duplicated here.
  enabled: true
  notification_store_limit: 200  # ring-buffer depth behind proactive.status.read
  announce_before_speaking: true # say who is speaking before unsolicited speech
  feedback_min_weight: 0.2       # learned bounds on hint frequency, never on urgent messages
  feedback_max_weight: 1.0
  feedback_step: 0.05
  timing_learner_enabled: true

memory:                          # the vault watcher, indexer and retrieval. The vault location
                                 # itself is paths.vault_dir above, not repeated here.
  embed_model: "nomic-embed-text" # served by the local model server; text search as a fallback
  vault_watch_debounce_s: 2.0    # a burst of saves triggers exactly one re-index
  retrieval_max_tokens: 4000     # hard cap on retrieved context
  retrieval_k: 8
  full_scan_on_boot: true
  retention_note_version_days: 30 # how long rollback copies of a note are kept
