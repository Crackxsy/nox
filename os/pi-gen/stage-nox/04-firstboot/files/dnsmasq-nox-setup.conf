# Nox-OS setup hotspot (NetworkManager's shared mode reads this folder for shared connections
# only - the setup hotspot is the only one): every name answers with the captive portal, nothing
# is forwarded, and the phone is told where the portal is (RFC 8910, DHCP option 114).
address=/#/10.42.0.1
no-resolv
dhcp-option=114,http://10.42.0.1/
