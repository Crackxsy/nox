# Nox-OS additions to nox.service (os/README.md); the unit itself stays as the installer ships it.
[Unit]
# No firewall, no Nox: if nftables.service could not load its rules (the boot rules, nothing of
# Nox's open), nox.service does not start either - never a Nox listening without a firewall.
Requires=nftables.service
After=nftables.service

[Service]
# nox.service, and only it, may reach the root helper's socket.
SupplementaryGroups=nox-os-helper
