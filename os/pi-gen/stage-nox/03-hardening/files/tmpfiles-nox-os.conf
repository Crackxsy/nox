# Nox-OS runtime folders (os/README.md). All under /run: nothing here survives a reboot.
d /run/nox-os               0755 root root -
d /run/nox-os/helper        0750 root nox-os-helper -
d /run/nox-os/ssh           0755 root root -
d /run/nox-os/sudoers.d     0750 root root -
# The keys the owner pasted for remote maintenance: the root helper's alone.
d /var/lib/nox-os            0700 root root -
