# Nox-OS: the system journal in memory only (SD-card wear, os/README.md). Lost on a reboot or
# power cut: the system's log of that boot. Nox's own audit chain lives in its database.
[Journal]
Storage=volatile
RuntimeMaxUse=32M
RuntimeKeepFree=64M
MaxRetentionSec=7day
ForwardToSyslog=no
ForwardToWall=no
