# Attaches to every GitHub release: the built dashboard and pet window as nox-ui-<tag>.tar.gz, and
# the installer itself as install-linux.sh, each with its SHA-256, plus release-manifest.json - the
# list of those files with sizes and SHA-256 and the commit the tag points to - and its Ed25519
# signature release-manifest.json.sig (docs/RELEASES.md). Once a release key is trusted,
# scripts/install-linux.sh and `nox update` refuse a release whose signed manifest is missing or
# does not match. A Raspberry Pi needs no Node.js toolchain; the documented
# `releases/latest/download/install-linux.sh` is always a tagged version.
#
# Three jobs on purpose: the build runs third-party npm code and therefore has a read-only token
# and no stored git credentials; the manifest job is the only one that sees the release key (an
# environment secret, released only after the owner approves the run when the environment has a
# required reviewer) and runs no npm code; only the upload job, which runs no repository or
# third-party code, may write - and it takes the installer from its own clean checkout of the tag.
#
# Without the secret NOX_RELEASE_SIGNING_KEY the manifest job writes an UNSIGNED manifest and a
# warning; the upload job then attaches the checksummed files as before, refuses to publish that
# manifest, and fails the run, so an unsigned release never looks like a signed one.
name: Release assets

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build UI bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build dashboard and pet
        run: |
          for app in dashboard pet; do
            (cd "ui/$app" && npm ci --ignore-scripts && npm run build)
          done

      - name: Pack
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tar --owner=0 --group=0 --numeric-owner -czf "nox-ui-$TAG.tar.gz" ui/dashboard/dist ui/pet/dist
          sha256sum "nox-ui-$TAG.tar.gz" > "nox-ui-$TAG.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ui-bundle
          path: nox-ui-*.tar.gz*
          if-no-files-found: error

  manifest:
    name: Release manifest (signed when the release key is configured)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The release key lives in this environment only. The owner gives the environment a required
    # reviewer, so no release is signed without the owner approving that run (docs/RELEASES.md).
    environment: release-signing
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          path: source

      - uses: actions/download-artifact@v8
        with:
          name: ui-bundle
          path: bundle

      - name: The files the release publishes
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="$(printf '%s\n' "nox-ui-$TAG.tar.gz" "nox-ui-$TAG.tar.gz.sha256")"
          actual="$(find bundle -mindepth 1 -printf '%P\n' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "unexpected artifact contents:"; echo "$actual"; exit 1
          fi
          (cd bundle && sha256sum --quiet -c "nox-ui-$TAG.tar.gz.sha256")
          mkdir files
          cp "bundle/nox-ui-$TAG.tar.gz" files/
          cp source/scripts/install-linux.sh files/install-linux.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Only the locked, hash-checked wheels every Pi installs too; nothing is built, and the
      # signing script imports nothing of them but `cryptography`.
      - name: Dependencies from the lock file
        working-directory: source
        run: |
          python -m pip install "uv==0.12.18"
          python -m uv sync --frozen --no-dev --no-build --no-install-project

      - name: Write the manifest and sign it
        id: sign
        working-directory: source
        env:
          # Read and removed from the environment by the script; never on a command line, never
          # printed (GitHub masks it in logs as well). Empty when the secret does not exist.
          NOX_RELEASE_SIGNING_KEY: ${{ secrets.NOX_RELEASE_SIGNING_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          .venv/bin/python scripts/sign_release.py --allow-unsigned
          --tag "$TAG" --commit "$(git rev-parse HEAD)" --out ../signed
          "../files/nox-ui-$TAG.tar.gz" ../files/install-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: signed/
          if-no-files-found: error

  upload:
    name: Attach to the release
    needs: [build, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The installer runs as root on every Pi, so it is taken from a clean checkout of the tag
      # here - never from the build job, where third-party npm code could have changed it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          sparse-checkout: scripts/install-linux.sh
          sparse-checkout-cone-mode: false
          path: source

      - name: Installer and its checksum
        run: |
          mkdir installer
          cp source/scripts/install-linux.sh installer/install-linux.sh
          (cd installer && sha256sum install-linux.sh > install-linux.sh.sha256)

      # Into its own folder, so nothing in the artifact can overwrite the installer above.
      - uses: actions/download-artifact@v8
        with:
          name: ui-bundle
          path: bundle

      - name: The artifact is exactly the bundle and its checksum
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="$(printf '%s\n' "nox-ui-$TAG.tar.gz" "nox-ui-$TAG.tar.gz.sha256")"
          actual="$(find bundle -mindepth 1 -printf '%P\n' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "unexpected artifact contents:"; echo "$actual"; exit 1
          fi
          find bundle -mindepth 1 ! -type f -print -quit | grep -q . && { echo "non-regular file in artifact"; exit 1; }
          (cd bundle && sha256sum --quiet -c "nox-ui-$TAG.tar.gz.sha256")

      - uses: actions/download-artifact@v8
        with:
          name: release-manifest
          path: manifest

      # Every installation checks the signature itself; here the manifest must describe exactly
      # the files about to be uploaded, so a mix-up never reaches a release.
      - name: The manifest lists exactly the files that are uploaded
        env:
          TAG: ${{ github.event.release.tag_name }}
          SIGNED: ${{ needs.manifest.outputs.signed }}
        run: |
          expected="release-manifest.json"
          if [ "$SIGNED" = "true" ]; then
            expected="$(printf '%s\n' release-manifest.json release-manifest.json.sig)"
          fi
          actual="$(find manifest -mindepth 1 -printf '%P\n' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "unexpected manifest artifact contents:"; echo "$actual"; exit 1
          fi
          find manifest -mindepth 1 ! -type f -print -quit | grep -q . && { echo "non-regular file in artifact"; exit 1; }
          python3 -I - manifest/release-manifest.json "bundle/nox-ui-$TAG.tar.gz" installer/install-linux.sh <<'PY'
          import hashlib, json, os, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          listed = {a["name"]: (a["size"], a["sha256"]) for a in manifest["assets"]}
          actual = {}
          for path in sys.argv[2:]:
              with open(path, "rb") as handle:
                  data = handle.read()
              actual[os.path.basename(path)] = (len(data), hashlib.sha256(data).hexdigest())
          if listed != actual:
              sys.exit(f"the manifest does not describe the uploaded files: {listed} != {actual}")
          PY

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          SIGNED: ${{ needs.manifest.outputs.signed }}
        run: |
          files=("bundle/nox-ui-$TAG.tar.gz" "bundle/nox-ui-$TAG.tar.gz.sha256"
                 installer/install-linux.sh installer/install-linux.sh.sha256)
          # An unsigned manifest is never published: it would only look like a signed one.
          if [ "$SIGNED" = "true" ]; then
            files+=(manifest/release-manifest.json manifest/release-manifest.json.sig)
          fi
          gh release upload "$TAG" --repo "$REPO" "${files[@]}"

      - name: Refuse to publish an unsigned release
        if: needs.manifest.outputs.signed != 'true'
        run: |
          echo "::error title=Release not signed::The release key (secret NOX_RELEASE_SIGNING_KEY in the environment release-signing) is not configured, so this release has no signed manifest and installations that trust a release key will refuse it. See docs/RELEASES.md."
          exit 1
