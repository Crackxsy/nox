# Attaches to every GitHub release: the built dashboard and pet window as nox-ui-<tag>.tar.gz, and
# the installer itself as install-linux.sh, each with its SHA-256. scripts/install-linux.sh
# downloads the bundle and refuses one that does not match, so a Raspberry Pi needs no Node.js
# toolchain; the documented `releases/latest/download/install-linux.sh` is always a tagged version.
#
# Two jobs on purpose: the build runs third-party npm code and therefore has a read-only token and
# no stored git credentials; only the upload job, which runs no repository code, may write.
name: Release assets

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build UI bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build dashboard and pet
        run: |
          for app in dashboard pet; do
            (cd "ui/$app" && npm ci --ignore-scripts && npm run build)
          done

      - name: Pack
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tar --owner=0 --group=0 --numeric-owner -czf "nox-ui-$TAG.tar.gz" ui/dashboard/dist ui/pet/dist
          sha256sum "nox-ui-$TAG.tar.gz" > "nox-ui-$TAG.tar.gz.sha256"
          cp scripts/install-linux.sh install-linux.sh
          sha256sum install-linux.sh > install-linux.sh.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: ui-bundle
          path: |
            nox-ui-*.tar.gz*
            install-linux.sh*
          if-no-files-found: error

  upload:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ui-bundle

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: >-
          gh release upload "$TAG" --repo "$REPO"
          "nox-ui-$TAG.tar.gz" "nox-ui-$TAG.tar.gz.sha256" install-linux.sh install-linux.sh.sha256
