# Nox CI. The desktop app ships on Windows 11, and several checks (shell tests, the e2e smoke)
# need a real Windows Qt/Chromium runtime, so those run on Windows. The core also runs as a server
# on Linux - a Raspberry Pi in the living room - so its unit and integration tests run on Linux too,
# on x86-64 and on ARM64 like the Pi itself.
#
# No secrets are used or required, and nothing here talks to a network service beyond the package
# registries (npm/PyPI) and the loopback `ai.rules` provider inside the walking-skeleton integration
# tests (deterministic, no model, no network) — no telemetry is sent anywhere.
name: CI

# Every pull request, and every state of develop and main after a merge (a merge of two green
# branches can still be red together). `push` is limited to those two branches, so a PR branch
# runs once (as a pull request), not twice. `merge_group` is there for a merge queue.
on:
  push:
    branches: [develop, main]
  pull_request:
  merge_group:

# A newer push to the same pull request supersedes the run in progress. Every other run (a merge
# into develop or main, a merge queue entry) gets a group of its own: GitHub keeps only one pending
# run per group, so a shared group would silently drop a merge's run when the next one queues.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, mypy, unit + integration tests)
    runs-on: windows-latest
    # The node and network-access integration tests start real cores over real TLS; on the
    # Windows runner the job needs about 20 minutes now.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --extra dev --extra shell --extra rl

      - name: Put the project venv on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$pwd\.venv\Scripts"

      - name: ruff check
        run: ruff check src tests evals

      - name: ruff format --check
        run: ruff format --check src tests evals

      - name: mypy
        run: mypy src/nox

      - name: mypy (benchmark harness)
        env:
          MYPYPATH: evals
        run: mypy evals/kann_alles evals/run_kann_alles.py

      - name: generated TypeScript types are up to date
        run: python scripts/gen_ts_types.py --check

      - name: pytest unit
        run: pytest tests/unit -m "not hardware and not network and not spike" -p no:cacheprovider

      # The rules provider (ai/providers/rules.py) is deterministic and needs no network, so this
      # is green with or without Ollama installed on the runner (tests already accept "rules" as a
      # valid provider when Ollama is absent).
      - name: pytest integration
        # -m "": every marker, as before the hermetic default in pyproject.toml.
        # NOX_WFP_LIVE: the hosted runner is an administrator and thrown away afterwards, so the
        # sandbox-rules helper is run against the real Base Filtering Engine (test_wfp_live.py).
        env:
          NOX_WFP_LIVE: "1"
        run: pytest tests/integration -m "" -p no:cacheprovider

  python-linux:
    name: Python on Linux (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is the Raspberry Pi's architecture (aarch64).
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The uv version scripts/install-linux.sh pins, so this checks what a Pi actually runs.
      - name: Install uv
        run: python -m pip install "uv==0.12.18"

      # What scripts/install-linux.sh does on a Pi: prebuilt wheels only, nothing compiled as root.
      - name: Server install needs no compiler
        run: python -m uv sync --frozen --no-build --dry-run

      # No `shell` extra: the server has no desktop, and PySide6 has no wheel for the Pi's glibc.
      # `rl` for the Rocket League plugin's tests (OpenCV headless has ARM64 wheels).
      - name: Sync dependencies
        run: python -m uv sync --extra dev --extra rl

      - name: shellcheck the installers
        run: shellcheck --severity=warning scripts/install-linux.sh scripts/install-macos.sh installer/linux/nox-command.sh

      - name: Put the project venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The POSIX-only branches (the file secret store, die_with_parent) are reachable only here;
      # the Win32-only modules have narrow overrides in pyproject.toml.
      - name: mypy
        run: mypy src/nox

      # The command sandbox: bubblewrap, as scripts/install-linux.sh installs it. Ubuntu 24.04
      # restricts unprivileged user namespaces through AppArmor; the installer adds a profile for
      # bwrap (proven in installer-linux below), this job simply lifts the restriction.
      - name: Install bubblewrap
        run: |
          sudo apt-get install -y -qq bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: pytest unit
        env:
          NOX_REQUIRE_BWRAP: "1"
        run: pytest tests/unit -m "not hardware and not network and not spike" -p no:cacheprovider

      - name: pytest integration
        env:
          NOX_REQUIRE_BWRAP: "1"
        # -m "": every marker, as before the hermetic default in pyproject.toml.
        run: pytest tests/integration -m "" -p no:cacheprovider

      # What nox.service gives the core (Delegate=yes): a cgroup subtree it owns. The sandbox
      # tests run once more inside such a delegated scope, so the memory and process ceilings
      # are proven to kill / refuse for real.
      - name: Sandbox ceilings in a delegated cgroup
        run: |
          sudo systemd-run --scope --quiet -p Delegate=yes -- sh -c '
            cg="/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)"
            chown -R "$0:$1" "$cg"
            exec setpriv --reuid="$0" --regid="$1" --init-groups env HOME="$2"               NOX_CGROUP_DELEGATED=1 NOX_EXPECT_CEILING=cgroup NOX_REQUIRE_BWRAP=1               "$3/.venv/bin/pytest" "$3/tests/integration/test_linux_sandbox.py" -p no:cacheprovider
          ' "$(id -u)" "$(id -g)" "$HOME" "$PWD"

  installer-linux:
    name: Installer on Linux (${{ matrix.runner }})
    # The hosted Ubuntu runners boot with systemd, so the real service - hardening included - is
    # installed, started, updated and checked, exactly as on a Raspberry Pi.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      # Root runs uv, so it is never piped from a download into a shell: the archive is checked
      # against hashes pinned in the script - which must be the ones uv published.
      - name: uv is pinned and verified, never piped into a shell
        run: |
          if grep -nE '\|[[:space:]]*(sh|bash)([[:space:]]|$)' scripts/install-linux.sh | grep -v '^[0-9]*:#'; then
            echo "the installer pipes a download into a shell"; exit 1
          fi
          version="$(sed -n 's/^UV_VERSION="\(.*\)"$/\1/p' scripts/install-linux.sh)"
          for arch in aarch64 x86_64; do
            var="UV_SHA256_$(echo "$arch" | tr '[:lower:]' '[:upper:]')"
            pinned="$(sed -n "s/^$var=\"\([0-9a-f]\{64\}\)\"$/\1/p" scripts/install-linux.sh)"
            upstream="$(curl -fsSL "https://github.com/astral-sh/uv/releases/download/$version/uv-$arch-unknown-linux-gnu.tar.gz.sha256" | cut -d' ' -f1)"
            test -n "$pinned" && test "$pinned" = "$upstream"
          done

      - name: First install
        run: sudo env NOX_SOURCE="$PWD" bash scripts/install-linux.sh

      - name: The service is up and answers
        run: |
          systemctl is-active nox
          curl -fsS http://127.0.0.1:47801/health
          nox where
          nox doctor || true
          # Answering is not enough: every extension (memory above all) must have started.
          if sudo journalctl -u nox --no-pager | grep -q "extension.failed"; then
            sudo journalctl -u nox --no-pager | grep "extension.failed"; exit 1
          fi

      - name: Paired devices reach it over HTTPS, nothing else does
        run: |
          # The installer turns network access on for a server; the listener is up within seconds.
          for _ in $(seq 1 30); do
            sudo curl -fsS --cacert /var/lib/nox/tls/ca.crt -o /dev/null \
              https://127.0.0.1:47843/nox-ca.crt && break
            sleep 1
          done
          sudo curl -fsS --cacert /var/lib/nox/tls/ca.crt -o /dev/null https://127.0.0.1:47843/nox-ca.crt
          # A foreign Host header (DNS rebinding) is turned away before any route runs.
          code="$(sudo curl -s -o /dev/null -w '%{http_code}' --cacert /var/lib/nox/tls/ca.crt \
            -H 'Host: evil.example' https://127.0.0.1:47843/dashboard/)"
          test "$code" = 421
          # The session-token surface does not exist on the network listener.
          code="$(sudo curl -s -o /dev/null -w '%{http_code}' --cacert /var/lib/nox/tls/ca.crt \
            https://127.0.0.1:47843/api/state)"
          test "$code" = 404
          # Pairing from the terminal, the way a server without a screen pairs its first device.
          nox pair --name ci | tee pair.txt
          grep -q '#pair=' pair.txt

      # The hardened unit must still let the command sandbox work: bwrap's namespaces, the egress
      # forwarder end to end and the delegated-cgroup ceiling are all probed when the core starts.
      - name: The command sandbox works inside the service
        run: |
          log="$(sudo journalctl -u nox --no-pager)"
          echo "$log" | grep -E "sandbox\.(linux_ready|egress_unavailable|cgroup_unavailable)|hands\.sandbox_unavailable" || true
          echo "$log" | grep -E "sandbox\.linux_ready" | grep -E "ceiling=.?cgroup" | grep -qE "egress=.?True"
          if echo "$log" | grep -qE "hands\.sandbox_unavailable|sandbox\.egress_unavailable"; then exit 1; fi

      # An earlier installer draft attached an unconfined profile to /usr/bin/bwrap. Installing
      # over it must unload it, so the system's bwrap is restricted again (checked next step).
      - name: Upgrade over the old global bwrap profile
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile nox-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' \
              | sudo tee /etc/apparmor.d/nox-bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/nox-bwrap
            /usr/bin/bwrap --unshare-user --ro-bind / / true  # the old profile really applied
            sudo env NOX_SOURCE="$PWD" bash scripts/install-linux.sh
            sudo find /var/backups/nox -name 'nox-*.tar.gz' -delete 2>/dev/null || true
          fi

      # Ubuntu restricts user namespaces through AppArmor. The installer must not lift that for
      # the system: only its own bwrap copy (executable by the nox user alone) gets a profile.
      - name: Only Nox's bwrap copy may create user namespaces
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            test "$(stat -c '%U:%G %a' /usr/lib/nox/bwrap)" = "root:nox 750"
            if /usr/lib/nox/bwrap --ro-bind / / true; then exit 1; fi
            if [ ! -e /etc/apparmor.d/bwrap-userns-restrict ]; then
              if /usr/bin/bwrap --unshare-user --ro-bind / / true; then exit 1; fi
            fi
          else
            test ! -e /usr/lib/nox/bwrap
          fi

      # What Nox's bwrap starts is confined by AppArmor itself, not only by bwrap's arguments:
      # even with a deliberately weakened command line (no --disable-userns, a capability added)
      # nested user namespaces and capabilities are refused.
      - name: The sandboxed profile holds even without bwrap's own restrictions
        run: |
          if [ -e /usr/lib/nox/bwrap ]; then
            bw() { sudo -u nox /usr/lib/nox/bwrap --unshare-user --ro-bind / / --proc /proc --dev /dev "$@"; }
            bw /usr/bin/true
            bw cat /proc/self/attr/current | grep -q "nox-bwrap-sandboxed"
            if bw /usr/bin/unshare -U true; then exit 1; fi
            if sudo -u nox /usr/lib/nox/bwrap --unshare-user --cap-add CAP_NET_RAW --ro-bind / / \
                --proc /proc --dev /dev /usr/bin/python3 -c \
                'import socket; socket.socket(socket.AF_INET, socket.SOCK_RAW, 1)'; then
              exit 1
            fi
          fi

      # A bubblewrap update the copy missed must stop the sandbox (fail closed); the apt hook
      # refreshes the copy, and the sandbox works again.
      - name: An outdated bwrap copy fails closed; the apt hook refreshes it
        run: |
          if [ -e /usr/lib/nox/bwrap ]; then
            # The sandbox log lines of the service process started by this restart, once written.
            fresh_log() {
              sudo systemctl restart nox
              pid="$(systemctl show -p MainPID --value nox)"
              for _ in $(seq 90); do
                sudo journalctl -u nox --no-pager _PID="$pid" | grep -E "sandbox\.linux_ready|hands\.sandbox_unavailable" && return 0
                sleep 1
              done
              return 1
            }
            # Stop the service first: its start-up probes run this very binary, and writing to
            # it while one runs fails with "Text file busy".
            sudo systemctl stop nox
            sudo sh -c 'printf x >> /usr/lib/nox/bwrap'
            fresh_log | grep -q "differs from /usr/bin/bwrap"
            sudo apt-get install --reinstall -y -qq bubblewrap >/dev/null
            sudo cmp /usr/bin/bwrap /usr/lib/nox/bwrap
            fresh_log | grep -E "sandbox\.linux_ready" | grep -q "egress=.\?True"
          fi

      - name: Same version again changes nothing
        run: |
          sudo env NOX_SOURCE="$PWD" bash scripts/install-linux.sh
          test "$(sudo find /var/backups/nox -name 'nox-*.tar.gz' 2>/dev/null | wc -l)" = 0
          curl -fsS http://127.0.0.1:47801/health

      - name: Update to a new version (built aside, snapshot, switch)
        run: |
          first="$(basename "$(readlink /opt/nox/current)")"
          echo "FIRST=$first" >> "$GITHUB_ENV"
          sudo -u nox touch /var/lib/nox/written-by-first
          git -c user.name=ci -c user.email=ci@example.invalid commit --allow-empty -q -m "second"
          sudo env NOX_SOURCE="$PWD" bash scripts/install-linux.sh
          second="$(basename "$(readlink /opt/nox/current)")"
          test "$second" != "$first"
          test -d "/opt/nox/releases/$first"
          test "$(sudo find /var/backups/nox -name 'nox-*.tar.gz' | wc -l)" = 1
          curl -fsS http://127.0.0.1:47801/health

      - name: Same version again keeps the way back
        run: |
          sudo env NOX_SOURCE="$PWD" bash scripts/install-linux.sh
          # The release `nox rollback` points to must survive the cleanup.
          test -d "/opt/nox/releases/$FIRST"
          test "$(cat /opt/nox/state/previous-release)" = "$FIRST"

      - name: nox rollback brings back version and data
        run: |
          sudo -u nox touch /var/lib/nox/written-by-second
          nox rollback
          test "$(basename "$(readlink /opt/nox/current)")" = "$FIRST"
          sudo test -e /var/lib/nox/written-by-first
          ! sudo test -e /var/lib/nox/written-by-second
          # The data that were replaced are kept aside, not deleted.
          sudo sh -c 'ls -d /var/lib/nox.vor-wiederherstellung-*'
          curl -fsS http://127.0.0.1:47801/health
          nox snapshots
          # Once: a second rollback must not put the same old data back over what came since.
          sudo -u nox touch /var/lib/nox/written-after-rollback
          if nox rollback; then echo "a second rollback was accepted"; exit 1; fi
          test "$(basename "$(readlink /opt/nox/current)")" = "$FIRST"
          sudo test -e /var/lib/nox/written-after-rollback

      - name: nox restore takes only snapshots Nox made
        run: |
          snap="$(sudo find /var/backups/nox -name 'nox-*.tar.gz' -printf '%f\n' | head -n1)"
          sudo cp "/var/backups/nox/$snap" /tmp/copy.tar.gz
          if nox restore /tmp/copy.tar.gz; then echo "restored from outside the backup folder"; exit 1; fi
          if nox restore ../../../tmp/copy.tar.gz; then echo "followed .. out of the backup folder"; exit 1; fi
          sudo -u nox touch /var/lib/nox/written-before-restore
          nox restore "$snap"
          ! sudo test -e /var/lib/nox/written-before-restore
          curl -fsS http://127.0.0.1:47801/health
          nox doctor || true

      - name: A broken version rolls itself back
        run: |
          before="$(basename "$(readlink /opt/nox/current)")"
          echo 'raise SystemExit("broken on purpose by CI")' >> src/nox/__init__.py
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -am "broken"
          if sudo env NOX_SOURCE="$PWD" bash scripts/install-linux.sh; then
            echo "the installer accepted a version that does not start"; exit 1
          fi
          test "$(basename "$(readlink /opt/nox/current)")" = "$before"
          curl -fsS http://127.0.0.1:47801/health
          git reset -q --hard HEAD~1

      - name: The UI bundle check refuses what a release never contains
        run: |
          mk() { rm -rf b && mkdir -p b/ui/dashboard/dist b/ui/pet/dist && echo ok > b/ui/dashboard/dist/index.html && echo ok > b/ui/pet/dist/index.html; }
          check() { sudo env NOX_ACTION=verify-bundle NOX_BUNDLE="$PWD/$1" bash scripts/install-linux.sh; }
          mk; tar -czf good.tar.gz -C b ui; check good.tar.gz
          mk; ln -s /etc/shadow b/ui/pet/dist/link; tar -czf link.tar.gz -C b ui; ! check link.tar.gz
          mk; echo x > b/evil.sh; tar -czf extra.tar.gz -C b ui evil.sh; ! check extra.tar.gz
          mk; rm -rf b/ui/pet; tar -czf half.tar.gz -C b ui; ! check half.tar.gz
          python3 - <<'PY'
          import io, tarfile
          with tarfile.open("dotdot.tar.gz", "w:gz") as archive:
              for name in ("ui/dashboard/dist/index.html", "ui/pet/dist/index.html", "ui/pet/dist/../../../evil"):
                  data = b"x"
                  info = tarfile.TarInfo(name); info.size = len(data)
                  archive.addfile(info, io.BytesIO(data))
          PY
          ! check dotdot.tar.gz

      # The installer's own signature check (openssl + python3 from the system) against releases
      # signed right here with throwaway keys made for this step only - never a release key. No
      # secret is involved; the release key itself is only ever used by release-assets.yml.
      - name: Signed releases - the installer refuses what it must
        run: |
          d="$(mktemp -d)"
          nox_py=/opt/nox/current/.venv/bin/python
          commit="$(git rev-parse HEAD)"
          for name in test other; do
            openssl genpkey -algorithm ed25519 -out "$d/$name.key" 2>/dev/null
            openssl pkey -in "$d/$name.key" -pubout -out "$d/$name.pub"
          done
          entry() { /opt/nox/current/.venv/bin/nox release describe-key "$d/$1.pub" --not-after "$2" | sed -n 's/^  "\(.*\)"$/\1/p'; }
          key="$(entry test 2999-12-31)"; expired="$(entry test 2020-01-01)"; other="$(entry other 2999-12-31)"
          test -n "$key" && test -n "$expired" && test -n "$other"
          # mk TAG: a release folder with a manifest built by Nox and signed by openssl.
          mk() {
            local dir="$d/rel-$1"
            mkdir -p "$dir"
            printf 'bundle' > "$dir/nox-ui-$1.tar.gz"
            "$nox_py" -c 'import pathlib, sys
          from nox.release.manifest import asset_for_file, build_manifest
          d = pathlib.Path(sys.argv[1])
          d.joinpath("release-manifest.json").write_bytes(build_manifest(tag=sys.argv[2], source_commit=sys.argv[3], assets=[asset_for_file(d / f"nox-ui-{sys.argv[2]}.tar.gz")]))' "$dir" "$1" "$commit"
            openssl pkeyutl -sign -inkey "$d/test.key" -rawin -in "$dir/release-manifest.json" -out "$d/sig.bin"
            printf '{"schema": "nox-release-signature/1", "algorithm": "ed25519", "key_id": "%s", "signature": "%s"}\n' \
              "${key%%|*}" "$(base64 -w0 "$d/sig.bin")" > "$dir/release-manifest.json.sig"
          }
          # check DIR TAG [NAME=VALUE...]: the installer's verify-release action.
          check() {
            local dir="$1" tag="$2"; shift 2
            sudo env NOX_ACTION=verify-release NOX_RELEASE_DIR="$dir" NOX_REF="$tag" NOX_EXPECT_COMMIT="$commit" \
              NOX_TEST_TRUSTED_KEYS="$key" "$@" bash scripts/install-linux.sh
          }
          # `! cmd` never stops a `bash -e` script, so a refusal is asserted like this.
          refused() { if check "$@"; then echo "accepted, but must be refused: $*"; return 1; fi; }
          mk v0.7.0; mk v0.6.0
          check "$d/rel-v0.7.0" v0.7.0 | grep -q "^verified ${key%%|*} [0-9a-f]\{64\} 0.7.0$"
          # Nox's own verifier agrees about the very same files.
          "$nox_py" -c 'import sys, pathlib
          from nox.release.keys import TrustedKey
          from nox.release.verify import verify_release
          d = pathlib.Path(sys.argv[1]); kid, day, spki = sys.argv[2].split("|")
          verify_release(d.joinpath("release-manifest.json").read_bytes(), d.joinpath("release-manifest.json.sig").read_bytes(), trusted_keys=[TrustedKey(kid, spki, day)], expect_tag="v0.7.0", expect_commit=sys.argv[3])' "$d/rel-v0.7.0" "$key" "$commit"
          # Another tag, another commit, an untrusted or expired key, an older version.
          refused "$d/rel-v0.7.0" v0.7.1
          refused "$d/rel-v0.7.0" v0.7.0 NOX_EXPECT_COMMIT=ffffffffffffffffffffffffffffffffffffffff
          refused "$d/rel-v0.7.0" v0.7.0 NOX_TEST_TRUSTED_KEYS="$other"
          refused "$d/rel-v0.7.0" v0.7.0 NOX_TEST_TRUSTED_KEYS="$expired"
          refused "$d/rel-v0.6.0" v0.6.0 NOX_RELEASE_FLOOR=0.7.0
          check "$d/rel-v0.6.0" v0.6.0 NOX_RELEASE_FLOOR=0.7.0 NOX_ALLOW_DOWNGRADE=1 | grep -q ' 0.7.0$'
          # One changed byte; a missing signature.
          sed -i 's/"size": 6/"size": 7/' "$d/rel-v0.7.0/release-manifest.json"
          refused "$d/rel-v0.7.0" v0.7.0
          rm "$d/rel-v0.6.0/release-manifest.json.sig"
          refused "$d/rel-v0.6.0" v0.6.0
          # Without a trusted key: "not configured" (exit 3), never "verified".
          status=0
          sudo env NOX_ACTION=verify-release NOX_RELEASE_DIR="$d/rel-v0.7.0" NOX_REF=v0.7.0 bash scripts/install-linux.sh || status=$?
          test "$status" = 3
          status=0; nox release keys || status=$?
          test "$status" = 3

      - name: The health check follows the port the core took
        run: |
          # Something else holds 47801 and answers 404 there: the core moves to the next free port
          # and says so in runtime/ipc.json, and that is where the installer has to look.
          sudo systemctl stop nox
          python3 -m http.server 47801 --bind 127.0.0.1 >/dev/null 2>&1 &
          squatter=$!
          for _ in $(seq 1 50); do curl -s -o /dev/null http://127.0.0.1:47801/ && break; sleep 0.2; done
          sudo env NOX_SOURCE="$PWD" bash scripts/install-linux.sh
          port="$(sudo sed -n 's/^ *"http_port": *\([0-9]*\),* *$/\1/p' /var/lib/nox/runtime/ipc.json)"
          test -n "$port" && test "$port" != 47801
          curl -fsS "http://127.0.0.1:$port/health"
          # The last step that talks to the service: 47801 stays in TIME_WAIT for a minute after
          # the squatter goes, so a restart now would move again - which is the point above.
          kill "$squatter"

      - name: Files and permissions are what the docs promise
        run: |
          test "$(sudo stat -c '%U %a' /var/lib/nox)" = "nox 700"
          test "$(sudo stat -c '%U %a' /var/lib/nox/user.yaml)" = "nox 600"
          test "$(stat -c '%U' /opt/nox)" = "root"
          # The folder is private: an ordinary account must not even list it.
          ! ls /var/lib/nox >/dev/null 2>&1
          if sudo test -e /var/lib/nox/secrets.json; then test "$(sudo stat -c '%a' /var/lib/nox/secrets.json)" = "600"; fi

      - name: Sandbox report (informational)
        if: always()
        run: systemd-analyze security nox --no-pager || true

      - name: Service log
        if: always()
        run: sudo journalctl -u nox -n 200 --no-pager || true

  installer-linux-node:
    name: Node installer on Linux (desktop and headless)
    # `install-linux.sh --node`: a desktop node as the logged-in user with a systemd *user* unit,
    # and a headless one with its own system user and a hardened system unit - installed twice
    # (idempotent), checked, uninstalled. Nothing is paired: there is no core here.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: A user manager for the runner account, as a desktop session has one
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "no user manager"; exit 1

      - name: Desktop node - install twice (idempotent)
        run: |
          NOX_SOURCE="$PWD" bash scripts/install-linux.sh --node
          NOX_SOURCE="$PWD" bash scripts/install-linux.sh --node

      - name: Desktop node - a user unit, never root
        run: |
          unit="$HOME/.config/systemd/user/nox-node.service"
          systemd-analyze --user verify "$unit"
          test "$(systemctl --user is-enabled nox-node)" = enabled
          if grep -q '^User=' "$unit"; then echo "a user unit names no user"; exit 1; fi
          if sudo test -e /etc/systemd/system/nox-node.service; then echo "no system unit"; exit 1; fi
          test "$(stat -c %U "$HOME/.local/share/nox-node-app/current/")" = "$USER"
          "$HOME/.local/bin/nox-node" status | tee /dev/stderr | grep -q "Not paired."

      - name: Desktop node - uninstall keeps the node's identity folder
        run: |
          mkdir -p "$HOME/.local/share/nox/node" && touch "$HOME/.local/share/nox/node/keep"
          bash scripts/install-linux.sh --node --uninstall
          for gone in "$HOME/.config/systemd/user/nox-node.service" "$HOME/.local/share/nox-node-app" "$HOME/.local/bin/nox-node"; do
            if [ -e "$gone" ]; then echo "left behind: $gone"; exit 1; fi
          done
          test -e "$HOME/.local/share/nox/node/keep"

      - name: Headless node - own system user, hardened unit
        run: |
          sudo env NOX_SOURCE="$PWD" bash scripts/install-linux.sh --node --headless
          systemd-analyze verify /etc/systemd/system/nox-node.service
          test "$(systemctl is-enabled nox-node)" = enabled
          grep -qx 'User=nox-node' /etc/systemd/system/nox-node.service
          grep -qx 'NoNewPrivileges=yes' /etc/systemd/system/nox-node.service
          test "$(sudo stat -c '%U %a' /var/lib/nox-node)" = "nox-node 700"
          test "$(stat -c %U /opt/nox-node)" = root
          sudo nox-node status | tee /dev/stderr | grep -q "Not paired."

      # Code the node account planted as a "self-installed version" never survives an install of
      # the program, and is never run: the launcher checks it against a signed release first.
      - name: Headless node - a reinstall drops versions the node account left behind
        run: |
          app=/var/lib/nox-node/node/app
          sudo -u nox-node mkdir -p "$app/releases/9.9.9/nox"
          echo '__version__ = "9.9.9"' | sudo -u nox-node tee "$app/releases/9.9.9/nox/__init__.py" >/dev/null
          echo '{"pending": "9.9.9", "floor": "0.0.1"}' | sudo -u nox-node tee "$app/state.json" >/dev/null
          sudo nox-node status >/dev/null  # the launcher refuses the unsigned folder: the base runs
          sudo env NOX_SOURCE="$PWD" bash scripts/install-linux.sh --node --headless
          if sudo test -e "$app/releases/9.9.9"; then echo "planted version survived"; exit 1; fi
          sudo grep -q '"pending": null' "$app/state.json"
          sudo grep -q '"floor": "0.0.1"' "$app/state.json"

      # The node's folders belong to nox-node; root's uninstall must never follow a link planted
      # there (to the node folder itself, or to its app/ folder).
      - name: Headless node - uninstall refuses links planted by the node user
        run: |
          sudo mkdir -p /srv/nox-canary/app && sudo touch /srv/nox-canary/app/keep
          # The unit started after the reinstall above; it would create its folder again.
          sudo systemctl stop nox-node
          for plant in node node/app; do
            sudo rm -rf /var/lib/nox-node/node
            if [ "$plant" = node/app ]; then sudo -u nox-node mkdir -p /var/lib/nox-node/node; fi
            target=/srv/nox-canary; [ "$plant" = node/app ] && target=/srv/nox-canary/app
            sudo -u nox-node ln -s "$target" "/var/lib/nox-node/$plant"
            if sudo bash scripts/install-linux.sh --node --headless --uninstall; then
              echo "uninstall followed a link at $plant"; exit 1
            fi
            test -e /srv/nox-canary/app/keep
            test -e /etc/systemd/system/nox-node.service  # refused before anything was removed
          done
          sudo rm -rf /var/lib/nox-node/node

      - name: Headless node - uninstall
        run: |
          sudo bash scripts/install-linux.sh --node --headless --uninstall
          if [ -e /etc/systemd/system/nox-node.service ] || [ -e /opt/nox-node ]; then exit 1; fi

      - name: Refusals - a desktop node never as root, a headless one only as root
        run: |
          if sudo env NOX_SOURCE="$PWD" bash scripts/install-linux.sh --node; then exit 1; fi
          if NOX_SOURCE="$PWD" bash scripts/install-linux.sh --node --headless; then exit 1; fi
          if bash scripts/install-linux.sh --headless; then exit 1; fi

      - name: Node logs
        if: always()
        run: |
          journalctl --user -u nox-node -n 100 --no-pager || true
          sudo journalctl -u nox-node -n 100 --no-pager || true

  ui:
    name: UI (${{ matrix.app }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [pet, dashboard]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/${{ matrix.app }}/package-lock.json

      - name: npm ci
        working-directory: ui/${{ matrix.app }}
        run: npm ci

      - name: npm run lint
        working-directory: ui/${{ matrix.app }}
        run: npm run lint

      - name: npm test
        working-directory: ui/${{ matrix.app }}
        run: npm test

      - name: npm run build
        working-directory: ui/${{ matrix.app }}
        run: npm run build

      # Spec UX-Neubau §12: start bundle <= 110 KB gzip, each lazy area <= 35 KB, CSS <= 12 KB.
      - name: Bundle budget
        if: matrix.app == 'dashboard'
        working-directory: ui/dashboard
        run: npm run size

      - name: Bundle budget (pet)
        if: matrix.app == 'pet'
        working-directory: ui/pet
        run: npm run check:bundle

      # The relief assets (parts atlas, depth maps, rig) must be exactly what
      # scripts/relief/build_relief.py makes from the checked-in configs and art; the script's
      # dependencies are pinned in its header. vitest already compares the recorded hashes
      # (reliefAssets.test.ts); this rebuilds every creature and compares the bytes.
      - uses: actions/setup-python@v7
        if: matrix.app == 'pet'
        with:
          python-version: "3.13"

      - name: Relief assets reproducible
        if: matrix.app == 'pet'
        shell: bash
        run: |
          python -m pip install uv
          for config in ui/pet/scripts/relief/creatures/*.json; do
            python -m uv run --no-project ui/pet/scripts/relief/build_relief.py "$(basename "$config" .json)" --check
          done

  guard-security-model:
    name: Guard - no input-synthesis / process-memory APIs (Security Model §10)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Security Model §10. Rocket League is observation-only (ENGINEERING.md hard rules), and
      # input synthesis is allowed in exactly two files - typing (`keyboard.py`) and the approved
      # computer-use module (`computer_use.py`, owner approval 2026-10-18) - each of which must
      # keep its game guard. The script scans src/ and every plugin under plugins/ for SendInput,
      # keybd_event, mouse_event, SetCursorPos, Post/SendMessage with keyboard or mouse-button
      # messages, and the automation / process-memory APIs; the unit test
      # tests/unit/security/test_input_synthesis_guard.py runs the same script.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Input synthesis stays in two guarded files
        shell: bash
        run: python scripts/check_input_synthesis.py

  release-hygiene:
    name: Release hygiene (third-party license audit, secrets scan)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # secrets_scan.py needs the base branch and the history, not a shallow clone

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --extra dev --extra shell

      - name: Put the project venv on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$pwd\.venv\Scripts"

      # Fails when a dependency's license is denied or unresolved against docs/license_policy.yaml.
      # Known open point as of 2026-09-14: piper-tts (voice extra) declares GPL-3.0-or-later on
      # PyPI, which this policy denies for bundled code - this step is expected to be red until
      # that is resolved (swap engine, or a documented exception), not a bug in the check itself.
      # See docs/THIRD_PARTY_LICENSES.md.
      - name: Third-party license audit
        run: python scripts/license_audit.py --check

      # Fails on any un-accepted secret-shaped finding in the working tree or in the history this
      # run is about: for a pull request the commits it adds on top of its base branch, for a push
      # the history of the pushed branch. Never every branch at once - a literal on one feature
      # branch must not fail every other pull request. Exclusions/acceptances:
      # docs/scan_policy_secrets.yaml.
      - name: Secrets scan (working tree + this branch's history)
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/secrets_scan.py --check --base "origin/$BASE_REF"
          else
            python scripts/secrets_scan.py --check
          fi

      - name: Upload third-party license report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: docs/THIRD_PARTY_LICENSES.md

  e2e:
    name: E2E (Playwright live-core smoke)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [python, ui]
    # Runs a real Chromium browser against the shipped UI bundles and a live headless core on this
    # Windows runner image. This is a required, blocking check (`continue-on-error: false` below):
    # a red run fails the build like any other job.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies (with e2e extra)
        run: python -m uv sync --extra dev --extra shell --extra e2e

      - name: Put the project venv on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$pwd\.venv\Scripts"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            ui/pet/package-lock.json
            ui/dashboard/package-lock.json

      - name: Build pet UI
        working-directory: ui/pet
        run: |
          npm ci
          npm run build

      - name: Build dashboard UI
        working-directory: ui/dashboard
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: pytest e2e
        # The network-access click test records every window on video and shoots every step at
        # phone, tablet and desktop size into this folder.
        env:
          NOX_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: pytest tests/e2e -m e2e -p no:cacheprovider

      - name: Upload click-test videos and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-clicktests
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
