# Dependency updates for Nox.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "python"]
    groups:
      python-dev-tooling:
        patterns: ["pytest*", "ruff", "mypy", "types-*", "coverage*"]

  - package-ecosystem: npm
    directory: "/ui/pet"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "ui"]
    groups:
      pet-dev-tooling:
        patterns: ["@types/*", "vite*", "vitest*", "typescript", "@vitejs/*"]
    # Held back on purpose; lift each line when its reason is gone.
    ignore:
      # typescript-eslint supports TypeScript only below 6.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet, and the accessibility rules stay.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Node's types follow the Node the UIs are built with (22, see ci.yml), not the newest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/ui/dashboard"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "ui"]
    groups:
      dashboard-dev-tooling:
        patterns: ["@types/*", "vite*", "vitest*", "typescript", "@vitejs/*"]
    # Held back on purpose; lift each line when its reason is gone.
    ignore:
      # typescript-eslint supports TypeScript only below 6.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet, and the accessibility rules stay.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Node's types follow the Node the UIs are built with (22, see ci.yml), not the newest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "ci"]
