# Dependency updates for Nox: security updates whenever they appear, everything else as ONE
# grouped pull request per ecosystem per month (solo maintainer, low noise).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "python"]
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/ui/pet"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "ui"]
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/ui/dashboard"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "ui"]
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "ci"]
