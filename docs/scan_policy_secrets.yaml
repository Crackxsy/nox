# Secrets-scan exclusion policy (ST-21-07, scripts/secrets_scan.py).
#
# exclude_paths: glob patterns (fnmatch, matched against the repo-relative POSIX path) skipped
# entirely in both the working-tree scan and the git-history scan. Use this for lock files,
# generated data and test-fixture directories that legitimately contain placeholder-shaped strings.
#
# accepted_findings: a specific (path, pattern) pair already reviewed and confirmed NOT a real
# secret (e.g. a test fixture literal like `password="s3cret"`). Every entry needs a `reason`.
# This does not hide a finding from the report - accepted findings are still listed, just marked
# accepted instead of failing `--check`. Never add an entry here for anything found in git history
# without first confirming (by reading the actual diff) that it was never a real, live credential.

exclude_paths:
  - "**/uv.lock"
  - "**/package-lock.json"
  - "**/*.lock"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/dist/**"
  - "**/__pycache__/**"
  - "docs/THIRD_PARTY_LICENSES.md"
  - "scripts/secrets_scan.py"
  - "docs/scan_policy_secrets.yaml"
  # Recorded Claude API stream sample used by tests/unit/ai (base64-encoded protobuf event
  # chunks) - high-entropy by construction, not a credential. Reviewed 2026-09-14: contains no
  # API key, token or auth header, only recorded assistant-turn payload bytes.
  - "tests/unit/ai/fixtures/claude_stream_sample.ndjson"

accepted_findings:
  - path: "installer/nox.iss"
    pattern: "high_entropy_token"
    reason: "Inno Setup directive ArchitecturesInstallIn64BitMode=x64compatible - a keyword, not a token."
  # OBS/Twitch test fakes and their integration test construct FakeObsServer(password=None) or a
  # literal placeholder like "s3cret" to exercise the auth-required/auth-not-required code path;
  # never a real credential and never touches the keyring (ENGINEERING.md: tests use an in-memory
  # secret backend). Reviewed against the actual diffs in commit a3f3eee - no real OBS/Twitch
  # credential was ever committed.
  - path: "tests/unit/plugins/obs/**"
    pattern: "*"
    reason: "OBS websocket test fakes - placeholder/None passwords only, in-memory, never real."
  - path: "tests/integration/test_obs_plugin.py"
    pattern: "*"
    reason: "OBS plugin integration test - reads from the in-memory KeyringSecretStore test double."
  # Deliberate fake-secret-shaped literals used to test the log/PII redaction filter and the
  # keyring secret store, never a live credential (ENGINEERING.md: "tests use an in-memory
  # backend"). Reviewed against the actual diffs in commit 8584d5c.
  - path: "tests/unit/core/test_logging.py"
    pattern: "*"
    reason: "Redaction-filter test fixture: a fake 'sk-live-...'-shaped literal must never be logged."
  - path: "tests/unit/security/test_secrets.py"
    pattern: "*"
    reason: "KeyringSecretStore test fixture (in-memory backend) using deliberately fake key literals."
  # Public source constant, not a secret: a fixed Crockford-style alphabet (no 0/O/1/I/L/U) used to
  # generate human-readable pairing codes (src/nox/remote/pairing.py CODE_ALPHABET). A string of
  # distinct characters is inherently high-entropy under a Shannon-entropy heuristic; reviewed
  # 2026-09-14, this is the alphabet itself, never a generated code or credential.
  - path: "src/nox/remote/pairing.py"
    pattern: "high_entropy_token"
    reason: "CODE_ALPHABET constant (public pairing-code character set), not a secret."
