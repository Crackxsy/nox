<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nox</title>
<link rel="stylesheet" href="/claim/claim.css">
<script src="/claim/claim.js" defer></script>
</head>
<body>
<main>
<p class="lang"><button type="button" id="lang" class="link"></button></p>
<h1 data-t="title">Claim this Nox</h1>
<p data-t="intro"></p>
<p id="state" role="status" aria-live="polite">...</p>
<div id="errors" class="summary" role="alert" tabindex="-1" hidden></div>
<form id="form" novalidate hidden>
<label for="code"><span data-t="code"></span>
<span class="hint" id="code-hint"></span></label>
<input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false"
 maxlength="40" aria-describedby="code-hint" required>
<label for="name" data-t="name"></label>
<input id="name" name="name" maxlength="64" autocomplete="off">
<fieldset id="security" hidden>
<legend data-t="security"></legend>
<div id="pin-fields" hidden>
<label for="pin"><span data-t="pin"></span>
<span class="hint" id="pin-hint" data-t="pin_hint"></span></label>
<input id="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="64"
 aria-describedby="pin-hint">
<label for="pin2" data-t="pin2"></label>
<input id="pin2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="64">
</div>
<div id="passphrase-fields" hidden>
<label for="passphrase"><span data-t="passphrase"></span>
<span class="hint" id="passphrase-hint" data-t="passphrase_hint"></span></label>
<input id="passphrase" type="password" autocomplete="new-password" maxlength="256"
 aria-describedby="passphrase-hint">
<label for="passphrase2" data-t="passphrase2"></label>
<input id="passphrase2" type="password" autocomplete="new-password" maxlength="256">
</div>
</fieldset>
<div id="fp-box" hidden>
<p data-t="fingerprint"></p>
<p class="box mono" id="fp"></p>
</div>
<button type="submit" id="submit" data-t="submit"></button>
</form>
<noscript><p>This page needs JavaScript. Diese Seite braucht JavaScript.</p></noscript>
</main>
</body>
</html>
