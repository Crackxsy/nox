<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet-Renderer: vorher / nachher</title>
<style>
:root { color-scheme: dark; --bg:#141417; --fg:#e8e8ea; --muted:#9a9aa3; --line:#2c2c33; }
body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
main { max-width:1100px; margin:0 auto; }
h1 { font-size:20px; margin:0 0 4px; } p { color:var(--muted); margin:0 0 16px; }
.pair { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px; }
figure { margin:0; } figcaption { color:var(--muted); font-size:13px; margin-top:6px; }
video { width:100%; height:auto; background:#1e1e22; border:1px solid var(--line); border-radius:6px; display:block; }
.bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:16px 0; }
button, select { background:#22222a; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:inherit; }
h2 { font-size:16px; margin:28px 0 8px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px; }
.grid figure video { border-radius:4px; }
</style></head><body><main>
<h1>__NAME__: bisheriger Rig-Renderer und Relief 2.5D</h1>
<p>Gleiche Zustandsfolge, gleiche Uhr, 520 × 520 auf OBS-Dunkelgrau. Links vorher (Netz-Rig, Posen-Überblendung), rechts nachher (Relief-Renderer).</p>
<div class="bar"><button id="play">Abspielen / Pause</button>
<label>Tempo <select id="rate"><option>0.25</option><option>0.5</option><option selected>1</option></select></label></div>
<div class="pair">
<figure><video id="a" src="tour-rig.mp4" muted playsinline loop></video><figcaption>Vorher: Rig-Renderer</figcaption></figure>
<figure><video id="b" src="tour-relief.mp4" muted playsinline loop></video><figcaption>Nachher: Relief 2.5D</figcaption></figure>
</div>
<h2 __STATES_HIDDEN__>Alle Zustände (Relief)</h2>
<div class="grid">__STATES__</div>
</main>
<script>
const a = document.getElementById('a'), b = document.getElementById('b');
document.getElementById('play').onclick = () => {
  if (a.paused) { b.currentTime = a.currentTime; a.play(); b.play(); } else { a.pause(); b.pause(); }
};
document.getElementById('rate').onchange = (e) => { a.playbackRate = b.playbackRate = Number(e.target.value); };
a.ontimeupdate = () => { if (Math.abs(a.currentTime - b.currentTime) > 0.08) b.currentTime = a.currentTime; };
</script></body></html>
