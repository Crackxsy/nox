<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>Nox</title>
    <!-- Only the transparency, so the frameless window never flashes a plate before the bundle's
         stylesheet (src/styles.css, which pulls in the shared tokens) applies. -->

      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
