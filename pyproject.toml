[project]
name = "nox"
version = "0.5.0"
description = "Nox - persistent, local-first personal digital companion (desktop pet, voice, stream bot, coach, project manager)."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Nox Project" }]
keywords = ["desktop-pet", "voice-assistant", "local-first", "privacy", "windows"]
classifiers = [
    # No "License ::" trove classifier: PEP 639's SPDX `license` string above is authoritative
    # and current packaging guidance says not to duplicate it as a classifier.
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0",
    # Round-trip YAML writer for `user.yaml` (#22): keeps the user's comments, key order and
    # quoting. MIT, compatible with Apache-2.0 (docs/THIRD_PARTY_LICENSES.md).
    "ruamel.yaml>=0.18",
    "structlog>=24.4",
    "websockets>=13.0",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psutil>=7.2.2",
    "sqlite-vec>=0.1.9",
    "keyring>=25.7.0",
    "watchdog>=6.0.0",
    "numpy>=2.5.3",
    "typer>=0.12",
    # Argon2id for the PIN hash (`nox.security.secrets`). Without it the PIN falls back to
    # PBKDF2-SHA256 and the log says so on every start. MIT.
    "argon2-cffi>=23.1",
    # Calendar feeds (`nox.day`): iCalendar parsing and RRULE expansion. BSD-2-Clause and
    # BSD-3-Clause/Apache-2.0 - chosen over recurring-ical-events, which is LGPL.
    "icalendar>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
shell = ["PySide6>=6.11.2", "pynput>=1.8.2"]
voice = ["faster-whisper>=1.2.1", "sounddevice>=0.5.6", "piper-tts>=1.8.0", "openwakeword>=0.6"]
# Kokoro TTS (#21): permissively licensed model + ONNX runtime, but `kokoro-onnx` still pulls
# GPL-3.0 `phonemizer`/espeak-ng for grapheme-to-phoneme - see NOTICE and
# docs/license_policy.yaml before shipping a bundled build with this extra.
voice-kokoro = ["kokoro-onnx>=0.6.1", "onnxruntime>=1.30.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.9",
    "mypy>=2.3.1",
    "types-PyYAML",
    "types-psutil",
]
e2e = ["playwright>=1.62.0", "pytest-playwright>=0.9.0"]
rl = ["mss>=9.0", "opencv-python-headless>=5.0.0.93", "numpy>=2.5.3"]

[project.scripts]
nox = "nox.cli:main"

[project.urls]
Homepage = "https://github.com/Crackxsy/nox"
Repository = "https://github.com/Crackxsy/nox"
Issues = "https://github.com/Crackxsy/nox/issues"
Changelog = "https://github.com/Crackxsy/nox/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.32.4"]  # >=1.27: PEP 639 `license = "Apache-2.0"` string support
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nox"]

# openwakeword 0.6.0 declares `tflite-runtime` for Linux, which has no wheels beyond Python
# 3.11 and makes the universal lock unsolvable. Nox only supports Windows, where openwakeword
# runs its models through ONNX Runtime, so the lock uses its metadata without that entry.
[[tool.uv.dependency-metadata]]
name = "openwakeword"
version = "0.6.0"
requires-dist = [
  "onnxruntime>=1.10.0,<2",
  "tqdm>=4.0,<5.0",
  "scipy>=1.3,<2",
  "scikit-learn>=1,<2",
  "requests>=2.0,<3",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "T20"]
ignore = ["S101", "S603", "S607", "ASYNC109"]
per-file-ignores = { "tests/**" = ["S", "T20"], "scripts/**" = ["T20", "S"], "ui/pet/scripts/**" = ["T20", "S"], "spikes/**" = ["T20", "S"], "src/nox/cli.py" = ["B008"], "src/nox/app.py" = ["ASYNC220", "ASYNC240", "T201"] }

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true

# Type-checked on Windows and on Linux (`mypy --platform linux` in the Linux job). These modules
# call the Win32 API through ctypes behind runtime platform checks; on Linux, `ctypes.windll` and
# the Win32 structures do not exist for mypy, so only those error kinds are silenced - and only
# here. Everything else in them, and every other module, is checked on both platforms.
[[tool.mypy.overrides]]
module = [
    "nox.desktop.win32",
    "nox.desktop.keyboard",
    "nox.sensors.win32",
    "nox.files.recycle",
    "nox.rl.paths",
]
disable_error_code = ["attr-defined", "has-type", "name-defined"]

[[tool.mypy.overrides]]
module = ["nox.core.jobobject"]
disable_error_code = ["attr-defined", "has-type"]

# The desktop shell needs PySide6, which a server install does not have.
[[tool.mypy.overrides]]
module = ["nox.shell.*"]
disallow_subclassing_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A bare `pytest` is hermetic: tests that reach real services, devices or toolchains run only when
# selected with -m (a later -m on the command line replaces this one; `-m ""` selects everything).
addopts = "-q -m 'not e2e and not network and not hardware and not spike'"
timeout = 60
timeout_method = "thread"
markers = [
    "spike: measurement/feasibility tests that need real hardware or services (deselect in CI)",
    "hardware: needs microphone/speaker/GPU",
    "network: needs network or external services",
    "e2e: browser smoke test against a live NoxCore (Playwright); needs ui/*/dist built",
]
